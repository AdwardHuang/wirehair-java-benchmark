
name: Build Wirehair JNI multi-platform JAR

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            file: wirehairjni.dll
          - os: ubuntu-22.04
            platform: linux-x86_64
            file: libwirehairjni.so

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Get Wirehair source
        run: git clone --depth 1 https://github.com/catid/wirehair.git wirehair-src

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/native `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DWIREHAIR_SOURCE_DIR="$PWD/wirehair-src"

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWIREHAIR_SOURCE_DIR="${GITHUB_WORKSPACE}/wirehair-src"

      - name: Build native library
        run: cmake --build build/native --config Release --parallel

      - name: Stage native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = "build/native/Release/${{ matrix.file }}"
          $destination = "native/${{ matrix.platform }}/${{ matrix.file }}"

          if (-not (Test-Path $source)) {
            Write-Host "Expected native library not found: $source"
            Get-ChildItem build/native -Recurse -File |
              Select-Object -ExpandProperty FullName
            exit 1
          }

          New-Item -ItemType Directory -Force `
            -Path "native/${{ matrix.platform }}" | Out-Null

          Copy-Item $source $destination

      - name: Stage native library (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux

          source="build/native/${{ matrix.file }}"
          destination="native/${{ matrix.platform }}/${{ matrix.file }}"

          if [ ! -s "$source" ]; then
            echo "Expected native library not found: $source"
            find build/native -type f -print
            exit 1
          fi

          mkdir -p "native/${{ matrix.platform }}"
          cp "$source" "$destination"
          test -s "$destination"

      # 关键修改：上传整个 native 目录，保留平台子目录。
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: native
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 下载 Windows 和 Linux 两个任务上传的原生库。
      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: src/main/resources/native
          merge-multiple: true

      - name: Verify native resources
        shell: bash
        run: |
          set -eux

          echo "Downloaded native libraries:"
          find src/main/resources/native -type f -print

          test -s src/main/resources/native/windows-x86_64/wirehairjni.dll
          test -s src/main/resources/native/linux-x86_64/libwirehairjni.so

      - name: Build JAR, sources and Javadocs
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify native binaries are embedded in JAR
        shell: bash
        run: |
          set -eux

          jar tf target/wirehair-jni-1.0.0.jar \
            > target/jar-contents.txt

          grep -Fx \
            'native/windows-x86_64/wirehairjni.dll' \
            target/jar-contents.txt

          grep -Fx \
            'native/linux-x86_64/libwirehairjni.so' \
            target/jar-contents.txt

      - name: Upload packaged JARs
        uses: actions/upload-artifact@v4
        with:
          name: wirehair-jni-jar
          path: |
            target/wirehair-jni-1.0.0.jar
            target/wirehair-jni-1.0.0-sources.jar
            target/wirehair-jni-1.0.0-javadoc.jar
          if-no-files-found: error
          retention-days: 30
