name: 构建 Wirehair JNI 多平台 JAR

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            file: wirehairjni.dll

          - os: ubuntu-22.04
            platform: linux-x86_64
            file: libwirehairjni.so

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Linux 构建工具
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build docker.io

      - name: 下载官方 Wirehair 源码
        run: git clone --depth 1 https://github.com/catid/wirehair.git wirehair-src

      - name: 配置 Windows 原生工程
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src/main/cpp -B build/native `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DWIREHAIR_SOURCE_DIR="$PWD/wirehair-src"

      - name: 配置并编译 Linux 原生工程
        if: runner.os == 'Linux'
        run: |
          set -eux

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash -euxc '
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y \
                build-essential \
                cmake \
                ninja-build \
                python3-pip \
                binutils \
                file

              python3 -m pip install "cmake==3.31.6"

              ldd --version
              getconf GNU_LIBC_VERSION

              cmake -S src/main/cpp -B build/linux-container \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DWIREHAIR_SOURCE_DIR=/workspace/wirehair-src

              cmake --build build/linux-container --parallel
            '

      - name: 编译 Windows JNI 原生库
        if: runner.os == 'Windows'
        run: cmake --build build/native --config Release --parallel

      - name: 整理 Windows 原生库
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = "build/native/Release/${{ matrix.file }}"
          $destination = "native/${{ matrix.platform }}/${{ matrix.file }}"

          if (-not (Test-Path $source)) {
            Write-Host "没有找到预期文件：$source"
            Get-ChildItem build/native -Recurse -File |
              Select-Object -ExpandProperty FullName
            exit 1
          }

          New-Item -ItemType Directory -Force `
            -Path "native/${{ matrix.platform }}" | Out-Null

          Copy-Item $source $destination

          if ((Get-Item $destination).Length -le 0) {
            exit 1
          }

      - name: 检查 Linux 原生库 GLIBC 版本
        if: runner.os == 'Linux'
        run: |
          set -eux

          source="build/linux-container/${{ matrix.file }}"

          if [ ! -s "$source" ]; then
            echo "没有找到预期文件：$source"
            find build/linux-container -type f -print
            exit 1
          fi

          file "$source"
          ldd "$source"

          echo "===== GLIBC 符号版本 ====="

          readelf --version-info "$source" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | sort -Vu

          max_glibc=$(
            readelf --version-info "$source" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
              | sort -Vu \
              | tail -n 1
          )

          if [ -z "$max_glibc" ]; then
            echo "无法读取 GLIBC 符号版本"
            exit 1
          fi

          echo "最高 GLIBC 符号版本：$max_glibc"

          if ! dpkg --compare-versions \
              "${max_glibc#GLIBC_}" le "2.31"; then
            echo "错误：原生库引用了高于 GLIBC 2.31 的符号"
            exit 1
          fi

      - name: 整理 Linux 原生库
        if: runner.os == 'Linux'
        run: |
          set -eux

          source="build/linux-container/${{ matrix.file }}"
          destination="native/${{ matrix.platform }}/${{ matrix.file }}"

          if [ ! -s "$source" ]; then
            echo "没有找到预期文件：$source"
            find build/linux-container -type f -print
            exit 1
          fi

          mkdir -p "native/${{ matrix.platform }}"
          cp "$source" "$destination"
          test -s "$destination"

      - name: 上传原生库
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: native
    runs-on: ubuntu-22.04

    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 下载原生库
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: src/main/resources/native
          merge-multiple: true

      - name: 检查原生库目录
        shell: bash
        run: |
          set -eux

          find src/main/resources/native -type f -print

          test -s src/main/resources/native/windows-x86_64/wirehairjni.dll
          test -s src/main/resources/native/linux-x86_64/libwirehairjni.so

      - name: 构建 JAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: 检查 JAR 内的原生库
        shell: bash
        run: |
          set -eux

          jar tf target/wirehair-jni-1.0.0.jar \
            > target/jar-contents.txt

          grep -Fx \
            'native/windows-x86_64/wirehairjni.dll' \
            target/jar-contents.txt

          grep -Fx \
            'native/linux-x86_64/libwirehairjni.so' \
            target/jar-contents.txt

      - name: 检查构建产物
        shell: bash
        run: |
          set -eux

          ls -lh target/

          test -s target/wirehair-jni-1.0.0.jar
          test -s target/wirehair-jni-1.0.0-sources.jar
          test -s target/wirehair-jni-1.0.0-javadoc.jar

      - name: 上传最终 JAR
        uses: actions/upload-artifact@v4
        with:
          name: wirehair-jni-1.0.0
          path: |
            target/wirehair-jni-1.0.0.jar
            target/wirehair-jni-1.0.0-sources.jar
            target/wirehair-jni-1.0.0-javadoc.jar
          if-no-files-found: error
          retention-days: 30
